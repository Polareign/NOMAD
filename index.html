<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>NOMAD GCS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

        :root {
            --bg:        #0a0c0f;
            --panel:     #10141a;
            --border:    #1e2530;
            --accent:    #00e5ff;
            --warn:      #ffb300;
            --danger:    #ff1744;
            --safe:      #00e676;
            --dim:       #3a4455;
            --text:      #c8d6e5;
            --text-dim:  #5a6a7e;
            --mono:      'Share Tech Mono', monospace;
            --sans:      'Barlow', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ─────────────────────────────────────── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .logo {
            font-family: var(--mono);
            font-size: 18px;
            letter-spacing: 4px;
            color: var(--accent);
        }

        .logo span { color: var(--text-dim); font-size: 11px; letter-spacing: 1px; display: block; }

        .conn-pill {
            font-family: var(--mono);
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #1a1f28;
            border: 1px solid var(--dim);
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conn-pill .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--dim);
            transition: background 0.4s;
        }

        .conn-pill.online .dot  { background: var(--safe); box-shadow: 0 0 6px var(--safe); }
        .conn-pill.online       { border-color: var(--safe); color: var(--safe); }

        /* ── Layout ──────────────────────────────────────── */
        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            height: calc(100vh - 55px);
        }

        /* ── Sidebar ─────────────────────────────────────── */
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 4px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-btn:hover  { color: var(--text); }

        .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 16px; }
        .tab-panel.active { display: block; }

        .section-label {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin: 18px 0 8px;
            text-transform: uppercase;
        }

        .section-label:first-child { margin-top: 0; }

        /* ── Form inputs ─────────────────────────────────── */
        .field { margin-bottom: 10px; }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-family: var(--mono);
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            padding: 8px 10px;
            border-radius: 4px;
            transition: border-color 0.2s;
        }

        input:focus { outline: none; border-color: var(--accent); }

        .btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 4px;
        }

        .btn-primary { background: #0d2a33; color: var(--accent); border: 1px solid var(--accent); }
        .btn-primary:hover { background: var(--accent); color: var(--bg); }

        .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

        .btn-warn { background: #2a1e00; color: var(--warn); border: 1px solid var(--warn); }
        .btn-warn:hover { background: var(--warn); color: var(--bg); }

        /* ── Destination cards ───────────────────────────── */
        .dest-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
            position: relative;
        }

        .dest-card:hover                 { border-color: var(--accent); }
        .dest-card.selected              { border-color: var(--accent); background: #041820; }
        .dest-card.selected::before {
            content: '▶';
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 10px;
        }

        .dest-card .id   { font-family: var(--mono); color: var(--accent); font-size: 13px; }
        .dest-card .name { font-size: 12px; color: var(--text); margin-top: 2px; }
        .dest-card .coords {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .dest-card .del-btn {
            position: absolute; right: 28px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: var(--dim); cursor: pointer; font-size: 14px;
            padding: 4px;
            transition: color 0.15s;
        }

        .dest-card .del-btn:hover { color: var(--danger); }

        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .status-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid var(--border);
        }

        .stat {
            padding: 12px 16px;
            border-right: 1px solid var(--border);
        }

        .stat:last-child { border-right: none; }
        .stat .key { font-family: var(--mono); font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
        .stat .val { font-family: var(--mono); font-size: 15px; color: var(--text); margin-top: 3px; }
        .stat .val.armed    { color: var(--warn); }
        .stat .val.airborne { color: var(--safe); }
        .stat .val.estop    { color: var(--danger); }

        .log-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.7;
        }

        .log-entry { display: flex; gap: 10px; }
        .log-entry .ts  { color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
        .log-entry .msg { color: var(--text); }
        .log-entry.warn .msg { color: var(--warn); }
        .log-entry.err  .msg { color: var(--danger); }
        .log-entry.ok   .msg { color: var(--safe); }
        .log-entry.info .msg { color: var(--accent); }

        .control-bar {
            border-top: 1px solid var(--border);
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--panel);
        }

        .dest-select-label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .selected-dest-display {
            font-family: var(--mono);
            font-size: 14px;
            color: var(--accent);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 14px;
            min-width: 80px;
            text-align: center;
            letter-spacing: 2px;
        }

        .launch-btn {
            padding: 10px 28px;
            background: #0a2d1a;
            color: var(--safe);
            border: 1px solid var(--safe);
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .launch-btn:hover:not(:disabled) {
            background: var(--safe);
            color: var(--bg);
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.3);
        }

        .launch-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .estop-btn {
            padding: 10px 20px;
            background: #2d0a0a;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
            margin-left: auto;
        }

        .estop-btn:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.4);
        }

        .clear-estop-btn {
            padding: 10px 14px;
            background: transparent;
            color: var(--warn);
            border: 1px solid var(--warn);
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
            display: none;
        }

        .clear-estop-btn:hover { background: var(--warn); color: var(--bg); }

        .hover-btn {
            padding: 10px 20px;
            background: transparent;
            color: var(--warn);
            border: 1px solid var(--warn);
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .hover-btn:hover:not(:disabled) {
            background: var(--warn);
            color: #0a0c0f;
            box-shadow: 0 0 16px rgba(255,179,0,0.35);
        }
        .hover-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .hover-btn.active {
            background: rgba(255,179,0,0.18);
            animation: hover-pulse 1.5s ease-in-out infinite;
        }

        .land-btn {
            padding: 10px 20px;
            background: transparent;
            color: #ff6b35;
            border: 1px solid #ff6b35;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: none;
        }
        .land-btn:hover {
            background: #ff6b35;
            color: #fff;
            box-shadow: 0 0 16px rgba(255,107,53,0.35);
        }

        #hoverCountdown {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }
        #hoverCountdown.show { display: flex; }
        #hoverCountdown .cd-label {
            font-family: var(--mono);
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--warn);
            text-transform: uppercase;
        }
        #hoverCountdown .cd-number {
            font-family: var(--mono);
            font-size: 96px;
            font-weight: 700;
            color: var(--warn);
            text-shadow: 0 0 40px var(--warn);
            animation: cd-pop 0.4s ease-out;
        }
        #hoverCountdown .cd-sub {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-dim);
        }
        #hoverCountdown .cd-cancel {
            margin-top: 12px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-dim);
            background: none;
            border: 1px solid var(--dim);
            padding: 6px 18px;
            border-radius: 3px;
            cursor: pointer;
        }
        #hoverCountdown .cd-cancel:hover { color: var(--text); border-color: var(--text); }

        @keyframes hover-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,179,0,0.5); }
            50%       { box-shadow: 0 0 0 8px rgba(255,179,0,0); }
        }
        @keyframes cd-pop {
            0%   { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .hb-bar {
            height: 2px;
            background: var(--border);
            position: relative;
            overflow: hidden;
        }

        .hb-bar .pulse {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: none;
        }

        .hb-bar .pulse.active { animation: hb-sweep 5s linear infinite; }

        @keyframes hb-sweep {
            from { left: -100%; }
            to   { left: 100%; }
        }

        .toast {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 12px;
            padding: 10px 20px;
            border-radius: 4px;
            transition: transform 0.3s, opacity 0.3s;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.ok   { border-color: var(--safe);   color: var(--safe); }
        .toast.err  { border-color: var(--danger);  color: var(--danger); }
        .toast.warn { border-color: var(--warn);    color: var(--warn); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

        @media (max-width: 700px) {
            .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
            .status-strip { grid-template-columns: repeat(2, 1fr); }
            .control-bar { flex-wrap: wrap; }
            .estop-btn { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">NOMAD <span>GROUND CONTROL</span></div>
    <div class="conn-pill" id="connPill">
        <div class="dot"></div>
        <span id="connLabel">OFFLINE</span>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('fly', this)">FLY</button>
            <button class="tab-btn" onclick="switchTab('dests', this)">DESTS</button>
            <button class="tab-btn" onclick="switchTab('params', this)">PARAMS</button>
        </div>

        <div id="tab-fly" class="tab-panel active">
            <div class="section-label">Select Destination</div>
            <div id="dest-select-list"></div>
        </div>

        <div id="tab-dests" class="tab-panel">
            <div class="section-label">Saved Destinations</div>
            <div id="dest-manage-list"></div>

            <div class="section-label">Add Destination</div>
            <div class="field"><label>ID</label><input type="text" id="newId" placeholder="A"></div>
            <div class="field"><label>NAME</label><input type="text" id="newName" placeholder="North Field"></div>
            <div class="field"><label>DESC</label><input type="text" id="newDesc" placeholder="optional"></div>
            <div class="field"><label>LAT</label><input type="number" id="newLat" placeholder="42.0000" step="0.00001"></div>
            <div class="field"><label>LON</label><input type="number" id="newLon" placeholder="-87.0000" step="0.00001"></div>
            <button class="btn btn-primary" onclick="saveDestination()">SAVE DESTINATION</button>

            <div class="section-label">Home Location</div>
            <div id="homeDisplay" style="font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:8px;"></div>
            <div class="field"><label>HOME LAT</label><input type="number" id="homeLat" step="0.00001"></div>
            <div class="field"><label>HOME LON</label><input type="number" id="homeLon" step="0.00001"></div>
            <button class="btn btn-primary" onclick="saveHome()">UPDATE HOME</button>
            <button class="btn btn-ghost" onclick="useCurrentLocation()" style="margin-top:6px">USE MY GPS</button>
        </div>

        <div id="tab-params" class="tab-panel">
            <div class="section-label">Flight Parameters</div>
            <div class="field"><label>TAKEOFF ALT (m)</label><input type="number" id="pAlt"   step="0.5"></div>
            <div class="field"><label>FLIGHT SPEED (m/s)</label><input type="number" id="pSpd"  step="0.1"></div>
            <div class="field"><label>YAW SENSITIVITY</label><input type="number" id="pYaw"  step="0.001"></div>
            <div class="field"><label>OBS TURN RATE</label><input type="number" id="pTurn" step="0.1"></div>
            <div class="field"><label>CONFIDENCE (0–1)</label><input type="number" id="pConf" step="0.05" min="0" max="1"></div>
            <div class="field"><label>LOW BATT VOLTAGE (V)</label><input type="number" id="pBatt" step="0.1"></div>
            <button class="btn btn-primary" onclick="saveParams()">SAVE PARAMS</button>
        </div>
    </aside>

    <main class="main">
        <div class="hb-bar"><div class="pulse" id="hbPulse"></div></div>

        <div class="status-strip">
            <div class="stat">
                <div class="key">MODE</div>
                <div class="val" id="sMode">—</div>
            </div>
            <div class="stat">
                <div class="key">DESTINATION</div>
                <div class="val" id="sDest">—</div>
            </div>
            <div class="stat">
                <div class="key">E-STOP</div>
                <div class="val" id="sEstop">—</div>
            </div>
            <div class="stat">
                <div class="key">HEARTBEAT</div>
                <div class="val" id="sHb">—</div>
            </div>
        </div>

        <div class="log-area" id="logArea"></div>

        <div class="control-bar">
            <span class="dest-select-label">DEST:</span>
            <div class="selected-dest-display" id="selectedDestDisplay">—</div>

            <button class="launch-btn" id="launchBtn" onclick="confirmLaunch()" disabled>
                LAUNCH
            </button>

            <button class="clear-estop-btn" id="clearEstopBtn" onclick="clearEstop()">
                CLEAR E-STOP
            </button>

            <button class="hover-btn" id="hoverBtn" onclick="confirmHover()" disabled>
                ■■ HOVER
            </button>

            <button class="land-btn" id="landBtn" onclick="confirmLand()">
                ▼ TURN OFF
            </button>

            <button class="estop-btn" onclick="confirmEstop()">
                ■ E-STOP
            </button>
        </div>
    </main>

</div>

<div id="hoverCountdown">
    <div class="cd-label">Engaging Hover Mode</div>
    <div class="cd-number" id="cdNumber">5</div>
    <div class="cd-sub">SWITCHING TO LOITER</div>
    <button class="cd-cancel" onclick="cancelHoverCountdown()">CANCEL</button>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedDest   = null;
let droneMode      = 'idle';
let estopActive    = false;
let heartbeatTimer = null;
let statusTimer    = null;

function log(msg, type = '') {
    const area = document.getElementById('logArea');
    const now  = new Date().toTimeString().slice(0, 8);
    const el   = document.createElement('div');
    el.className = `log-entry ${type}`;
    el.innerHTML = `<span class="ts">${now}</span><span class="msg">${msg}</span>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
}

function toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = `toast ${type} show`;
    setTimeout(() => t.className = `toast ${type}`, 2500);
}

function switchTab(id, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
}

async function pollStatus() {
    try {
        const r = await fetch('/api/status');
        if (!r.ok) throw new Error('status ' + r.status);
        const s = await r.json();

        const pill = document.getElementById('connPill');
        pill.classList.add('online');
        document.getElementById('connLabel').textContent = 'ONLINE';

        droneMode   = s.drone_mode;
        estopActive = s.emergency_stop;

        const modeEl = document.getElementById('sMode');
        modeEl.textContent = s.drone_mode.toUpperCase();
        modeEl.className = 'val ' + (s.drone_mode === 'airborne' ? 'airborne'
                                   : s.drone_mode === 'preflight' ? 'armed' : '');

        document.getElementById('sDest').textContent =
            s.current_destination || '—';

        const estopEl = document.getElementById('sEstop');
        estopEl.textContent = s.emergency_stop ? 'ACTIVE' : 'CLEAR';
        estopEl.className   = 'val' + (s.emergency_stop ? ' estop' : '');

        const hbEl = document.getElementById('sHb');
        if (s.last_heartbeat) {
            const age = Math.round(Date.now() / 1000 - s.last_heartbeat);
            hbEl.textContent = age + 's ago';
            hbEl.className = 'val' + (age > 10 ? ' estop' : age > 5 ? ' armed' : '');
        } else {
            hbEl.textContent = 'NONE';
        }

        updateLaunchBtn();
        updateEstopControls();

    } catch (e) {
        const pill = document.getElementById('connPill');
        pill.classList.remove('online');
        document.getElementById('connLabel').textContent = 'OFFLINE';
    }
}

async function sendHeartbeat() {
    if (droneMode !== 'airborne' && droneMode !== 'preflight') return;
    try {
        await fetch('/api/heartbeat', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}) });
        document.getElementById('hbPulse').className = 'pulse active';
    } catch (e) {
        log('Heartbeat send failed — drone will auto-land if airborne!', 'err');
    }
}

function selectDest(id) {
    selectedDest = id;
    document.getElementById('selectedDestDisplay').textContent = id;
    document.querySelectorAll('.dest-card.selectable').forEach(c => {
        c.classList.toggle('selected', c.dataset.id === id);
    });
    updateLaunchBtn();
    log(`Destination selected: ${id}`, 'info');
}

function updateLaunchBtn() {
    const btn = document.getElementById('launchBtn');
    const canLaunch = selectedDest && !estopActive &&
                      droneMode !== 'airborne';
    btn.disabled = !canLaunch;
}

function updateEstopControls() {
    document.getElementById('clearEstopBtn').style.display =
        estopActive ? 'block' : 'none';
    updateHoverControls();
}

async function confirmLaunch() {
    if (!selectedDest) { toast('Select a destination first', 'warn'); return; }
    if (estopActive)   { toast('Clear E-STOP before launching', 'err'); return; }

    if (!confirm(`Launch to destination ${selectedDest}?\n\nEnsure area is clear and props are secure.`))
        return;

    try {
        const r = await fetch('/api/launch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ destination: selectedDest }),
        });
        const data = await r.json();
        if (r.ok) {
            log(`Launch authorized → ${selectedDest}`, 'ok');
            toast('Launch authorized', 'ok');
        } else {
            log(`Launch rejected: ${data.error}`, 'err');
            toast(data.error, 'err');
        }
    } catch (e) {
        log('Launch request failed: ' + e, 'err');
        toast('Request failed', 'err');
    }
}

async function confirmEstop() {
    if (!confirm('EMERGENCY STOP?\n\nDrone will land immediately.')) return;
    try {
        const r = await fetch('/api/emergency-stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ confirm: 'EMERGENCY_STOP_CONFIRMED' }),
        });
        const data = await r.json();
        if (r.ok) {
            log('EMERGENCY STOP ACTIVATED', 'err');
            toast('Emergency stop sent', 'err');
        } else {
            log('E-STOP rejected: ' + data.error, 'err');
        }
    } catch (e) {
        log('E-STOP request failed: ' + e, 'err');
        toast('Request failed', 'err');
    }
}

async function clearEstop() {
    if (!confirm('Clear emergency stop?')) return;
    try {
        const r = await fetch('/api/emergency-stop/clear', { method: 'POST' });
        const data = await r.json();
        if (r.ok) {
            log('Emergency stop cleared', 'warn');
            toast('E-Stop cleared', 'warn');
        }
    } catch (e) {
        toast('Request failed', 'err');
    }
}

async function loadDestinations() {
    try {
        const r    = await fetch('/api/destinations');
        const data = await r.json();

        // Fly tab — selectable cards (exclude home)
        const flyList = document.getElementById('dest-select-list');
        flyList.innerHTML = '';
        for (const [id, d] of Object.entries(data)) {
            if (id === 'home') continue;
            const card = document.createElement('div');
            card.className = 'dest-card selectable';
            card.dataset.id = id;
            card.onclick = () => selectDest(id);
            card.innerHTML = `
                <div class="id">${id}</div>
                <div class="name">${d.name || id}</div>
                <div class="coords">${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)}</div>`;
            if (selectedDest === id) card.classList.add('selected');
            flyList.appendChild(card);
        }

        const manageList = document.getElementById('dest-manage-list');
        manageList.innerHTML = '';
        for (const [id, d] of Object.entries(data)) {
            const card = document.createElement('div');
            card.className = 'dest-card';
            card.innerHTML = `
                <div class="id">${id}</div>
                <div class="name">${d.name || id}</div>
                <div class="coords">${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)}</div>
                ${id !== 'home' ? `<button class="del-btn" onclick="deleteDest('${id}')">✕</button>` : ''}`;
            manageList.appendChild(card);
        }
    } catch (e) {
        log('Failed to load destinations: ' + e, 'err');
    }
}

async function saveDestination() {
    const payload = {
        id:        document.getElementById('newId').value.trim().toUpperCase(),
        name:      document.getElementById('newName').value.trim(),
        description: document.getElementById('newDesc').value.trim(),
        latitude:  parseFloat(document.getElementById('newLat').value),
        longitude: parseFloat(document.getElementById('newLon').value),
    };
    if (!payload.id || isNaN(payload.latitude) || isNaN(payload.longitude)) {
        toast('ID, latitude, and longitude are required', 'err'); return;
    }
    try {
        const r = await fetch('/api/destinations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        if (r.ok) {
            log(`Destination ${payload.id} saved`, 'ok');
            toast('Destination saved', 'ok');
            ['newId','newName','newDesc','newLat','newLon'].forEach(id =>
                document.getElementById(id).value = '');
            loadDestinations();
        } else {
            const d = await r.json();
            toast(d.error || 'Save failed', 'err');
        }
    } catch (e) { toast('Request failed', 'err'); }
}

async function deleteDest(id) {
    if (!confirm(`Delete destination ${id}?`)) return;
    try {
        const r = await fetch(`/api/destinations/${id}`, { method: 'DELETE' });
        if (r.ok) { log(`Deleted ${id}`, 'warn'); loadDestinations(); }
        else { const d = await r.json(); toast(d.error, 'err'); }
    } catch (e) { toast('Request failed', 'err'); }
}

async function loadHome() {
    try {
        const r = await fetch('/api/home');
        const d = await r.json();
        document.getElementById('homeLat').value = d.latitude  || '';
        document.getElementById('homeLon').value = d.longitude || '';
        document.getElementById('homeDisplay').textContent =
            d.latitude ? `${d.latitude.toFixed(6)}, ${d.longitude.toFixed(6)}` : 'Not set';
    } catch(e) {}
}

async function saveHome() {
    const lat = parseFloat(document.getElementById('homeLat').value);
    const lon = parseFloat(document.getElementById('homeLon').value);
    if (isNaN(lat) || isNaN(lon)) { toast('Enter valid coordinates', 'err'); return; }
    try {
        const r = await fetch('/api/home', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ latitude: lat, longitude: lon }),
        });
        if (r.ok) { toast('Home updated', 'ok'); log('Home location updated', 'ok'); loadHome(); }
    } catch(e) { toast('Request failed', 'err'); }
}

function useCurrentLocation() {
    if (!navigator.geolocation) { toast('Geolocation not supported', 'err'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById('homeLat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('homeLon').value = pos.coords.longitude.toFixed(6);
        toast('GPS captured — tap UPDATE HOME to save', 'warn');
    }, err => toast('GPS error: ' + err.message, 'err'));
}

async function loadParams() {
    try {
        const r = await fetch('/api/flight-parameters');
        const d = await r.json();
        document.getElementById('pAlt').value  = d.takeoff_altitude    || '';
        document.getElementById('pSpd').value  = d.flight_speed        || '';
        document.getElementById('pYaw').value  = d.yaw_sensitivity     || '';
        document.getElementById('pTurn').value = d.obstacle_turn_rate  || '';
        document.getElementById('pConf').value = d.confidence_threshold|| '';
        document.getElementById('pBatt').value = d.low_battery_voltage || '';
    } catch(e) {}
}

async function saveParams() {
    const payload = {
        takeoff_altitude:    parseFloat(document.getElementById('pAlt').value),
        flight_speed:        parseFloat(document.getElementById('pSpd').value),
        yaw_sensitivity:     parseFloat(document.getElementById('pYaw').value),
        obstacle_turn_rate:  parseFloat(document.getElementById('pTurn').value),
        confidence_threshold:parseFloat(document.getElementById('pConf').value),
        low_battery_voltage: parseFloat(document.getElementById('pBatt').value),
    };
    try {
        const r = await fetch('/api/flight-parameters', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const d = await r.json();
        if (r.ok) { toast('Parameters saved', 'ok'); log('Flight params updated', 'ok'); }
        else       { toast(d.error || 'Save failed', 'err'); }
    } catch(e) { toast('Request failed', 'err'); }
}

let hoverActive    = false;
let cdTimer        = null;
let cdCancelled    = false;

function updateHoverControls() {
    const btn      = document.getElementById('hoverBtn');
    const landBtn  = document.getElementById('landBtn');
    const canHover = (droneMode === 'airborne' || droneMode === 'hover') && !estopActive;

    btn.disabled = !canHover;

    if (hoverActive) {
        btn.textContent = '■■ HOVERING';
        btn.classList.add('active');
        landBtn.style.display = 'inline-block';
    } else {
        btn.textContent = '■■ HOVER';
        btn.classList.remove('active');
        landBtn.style.display = 'none';
    }
}

async function pollHoverStatus() {
    try {
        const r = await fetch('/api/hover/status');
        if (!r.ok) return;
        const s = await r.json();
        hoverActive = s.active;
        if (s.countdown !== null && s.countdown !== undefined && cdTimer === null) {
            showCountdownOverlay(s.countdown);
        }

        updateHoverControls();
    } catch (_) {}
}

function showCountdownOverlay(startNum) {
    const overlay = document.getElementById('hoverCountdown');
    const numEl   = document.getElementById('cdNumber');
    overlay.classList.add('show');
    numEl.textContent = startNum;
    cdCancelled = false;

    let count = startNum;
    cdTimer = setInterval(() => {
        if (cdCancelled) {
            clearInterval(cdTimer);
            cdTimer = null;
            overlay.classList.remove('show');
            return;
        }
        count--;
        numEl.style.animation = 'none';
        void numEl.offsetWidth;
        numEl.style.animation = 'cd-pop 0.4s ease-out';
        numEl.textContent = count;

        if (count <= 0) {
            clearInterval(cdTimer);
            cdTimer = null;
            overlay.classList.remove('show');
            hoverActive = true;
            updateHoverControls();
            log('Hover mode activated — drone holding position', 'ok');
            toast('Hover active', 'ok');
        }
    }, 1000);
}

async function confirmHover() {
    if (estopActive)         { toast('Clear E-STOP first', 'err'); return; }
    if (droneMode !== 'airborne' && droneMode !== 'hover') {
        toast('Drone must be airborne to hover', 'err'); return;
    }
    if (!confirm('Engage hover mode?\n\nDrone will hold its current position for 5 seconds then lock in LOITER.'))
        return;

    try {
        const r = await fetch('/api/hover', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ countdown: 5 }),
        });
        const data = await r.json();
        if (r.ok) {
            log('Hover countdown started (5s)', 'warn');
            showCountdownOverlay(5);
        } else {
            log('Hover rejected: ' + data.error, 'err');
            toast(data.error, 'err');
        }
    } catch (e) {
        log('Hover request failed: ' + e, 'err');
        toast('Request failed', 'err');
    }
}

async function confirmLand() {
    if (!confirm('TURN OFF HOVER and land?\n\nDrone will descend and disarm.')) return;
    try {
        const r = await fetch('/api/hover/land', { method: 'POST' });
        const data = await r.json();
        if (r.ok) {
            hoverActive = false;
            updateHoverControls();
            log('Landing initiated — drone descending', 'warn');
            toast('Landing…', 'warn');
        } else {
            log('Land rejected: ' + data.error, 'err');
            toast(data.error || 'Land failed', 'err');
        }
    } catch (e) {
        log('Land request failed: ' + e, 'err');
        toast('Request failed', 'err');
    }
}

function cancelHoverCountdown() {
    cdCancelled = true;
    fetch('/api/hover/land', { method: 'POST' }).catch(() => {});
    log('Hover countdown cancelled', 'warn');
    toast('Hover cancelled', 'warn');
}

window.addEventListener('load', () => {
    log('NOMAD GCS loaded', 'info');
    loadDestinations();
    loadHome();
    loadParams();
    pollStatus();
    statusTimer = setInterval(() => { pollStatus(); pollHoverStatus(); }, 2000);
    pollHoverStatus();

    heartbeatTimer = setInterval(sendHeartbeat, 5000);
});
</script>
